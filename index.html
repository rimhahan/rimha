<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rimha</title>
  <link rel="icon" type="image/png" href="/images/icon.png?v=12">
  <link rel="shortcut icon" type="image/png" href="/images/icon.png?v=12">
  <link rel="apple-touch-icon" href="/images/icon.png?v=12">
  <style>
    @font-face {
      font-family: 'Party LET';
      src: url('./fonts/PartyLET.woff2') format('woff2'),
           url('./fonts/PartyLET.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: block;
    }

    :root {
      /* 🎨 바탕색 필요시 여기서 변경 */
      --bg: #ffffff;
      --text: #111111;
      --hover-text: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      background: var(--bg);
      overflow: hidden;
    }

.stage {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 25vh; /* 이 숫자를 키우면 아래로 내려가고, 줄이면 위로 더 올라갑니다! */
      padding-left: 24px;
      padding-right: 24px;
      background-image: url('images/ggg.jpg');
      background-size: cover;
      background-position: center;
      position: relative;
    }

    /* 1. 중앙 메인 이름 (여기에만 호버 효과 적용) */
    .name-link {
      position: relative;
      z-index: 1;
      font-family: 'Party LET', cursive, sans-serif;
      font-size: clamp(8rem, 40vw, 32rem);
      line-height: 1;
      color: var(--text);
      text-decoration: none;
      letter-spacing: 0.02em;
      user-select: none;
      cursor: pointer;
      transition: color 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .name-link:hover,
    .name-link:focus-visible {
      color: var(--hover-text);
    }

    .name-link:focus-visible {
      outline: 2px dashed var(--text);
      outline-offset: 12px;
    }

    /* 2. 하단 고정 정보 (효과 없이 항상 기본 색상 유지) */
    .footer-info {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      text-align: center;
      font-family: 'Party LET', cursive, sans-serif;
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      color: var(--text);
      line-height: 1.1;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      user-select: none;
      pointer-events: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .name-link { transition: none; }
    }
  </style>
</head>
<body>

  <main class="stage">
    <!-- 중앙 메인 이름 (마우스 올리면 흰색으로 변경) -->
    <a class="name-link" href="https://instagram.com/rimhahan">rimha</a>

    <!-- 하단 고정 정보 (변화 없음) -->
    <div class="footer-info">
      EDITORIAL&BOOKDESIGNER<br>
      RIMHAHANQGMAIL.COM<br>
  
    </div>
  </main>

  <script>
    window.addEventListener('load', () => {
      if (window.location.search) {
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    });
  </script>

</body>
</html>
