<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rimha</title>
  <link rel="icon" type="image/png" href="/images/icon.png?v=5">
  <link rel="shortcut icon" type="image/png" href="/images/icon.png?v=5">
  <link rel="apple-touch-icon" href="/images/icon.png?v=5">
  <style>
    @font-face {
      font-family: 'Party LET';
      src: url('./fonts/PartyLET.woff2') format('woff2'),
           url('./fonts/PartyLET.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: block;
    }

    :root {
      --text:     #111111;
      --invert-text: #ffffff;
      --hover-bg: #111111;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    /* 배경색을 완전히 없애고 순수한 기본 배경으로 설정 */
    body {
      background: #ffffff;
      overflow: hidden;
    }

    .stage {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }

    .name-link {
      position: relative;
      z-index: 1;
      font-family: 'Party LET', cursive, sans-serif;
      font-size: clamp(8rem, 40vw, 32rem);
      line-height: 1;
      color: var(--text);
      text-decoration: none;
      letter-spacing: 0.02em;
      user-select: none;
      cursor: pointer;
      padding: 0.1em 0.2em;
      border-radius: 8px;
      /* 부드러운 색상 전환 효과 */
      transition: color 0.3s cubic-bezier(0.16, 1, 0.3, 1), 
                  background-color 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 마우스를 올렸을 때: 배경은 진하게 채워지고 글자는 하얀색으로 반전 */
    .name-link:hover,
    .name-link:focus-visible {
      color: var(--invert-text);
      background-color: var(--hover-bg);
    }

    .name-link:focus-visible {
      outline: 2px dashed var(--text);
      outline-offset: 12px;
    }

    @media (prefers-reduced-motion: reduce) {
      .name-link { transition: none; }
    }
  </style>
</head>
<body>

  <main class="stage">
    <a class="name-link" href="https://instagram.com/rimhahan">rimha</a>
  </main>

  <script>
    window.addEventListener('load', () => {
      if (window.location.search) {
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    });
  </script>

</body>
</html>
