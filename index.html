<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rimha</title>
  <link rel="icon" type="image/png" href="/images/icon.png?v=4">
  <link rel="shortcut icon" type="image/png" href="/images/icon.png?v=4">
  <link rel="apple-touch-icon" href="/images/icon.png?v=4">
  <style>
    @font-face {
      font-family: 'Party LET';
      src: url('./fonts/PartyLET.woff2') format('woff2'),
           url('./fonts/PartyLET.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: block;
    }

    :root {
      --text:     #111111;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      background: radial-gradient(circle at 50% 40%, var(--bg-start), var(--bg-end));
      overflow: hidden;
    }

    .stage {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-image: url('images/ggg.jpg');
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .stage::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255, 111, 168, 0.35);
    }

    .name-link {
      position: relative;
      z-index: 1;
      font-family: 'Party LET', cursive, sans-serif;
      font-size: clamp(8rem, 40vw, 32rem);
      line-height: 1;
      color: var(--text);
      text-decoration: none;
      letter-spacing: 0.02em;
      user-select: none;
      cursor: pointer;
      /* 기본 상태의 차분한 그림자 (종이가 살짝 떠 있는 느낌) */
      text-shadow: 2px 6px 16px rgba(0, 0, 0, 0.15);
      transform: translateY(0);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), 
                  text-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 마우스를 올렸을 때 위로 미세하게 떠오르며 깊이감 있는 그림자 부여 */
    .name-link:hover,
    .name-link:focus-visible {
      transform: translateY(-8px);
      text-shadow: 4px 14px 30px rgba(0, 0, 0, 0.25);
    }

    .name-link:focus-visible {
      outline: 2px dashed var(--text);
      outline-offset: 12px;
      border-radius: 4px;
    }

    @media (prefers-reduced-motion: reduce) {
      .name-link { transition: none; }
      .name-link:hover, .name-link:focus-visible { transform: none; }
    }
  </style>
</head>
<body>

  <main class="stage">
    <a class="name-link" href="https://instagram.com/rimhahan">rimha</a>
  </main>

  <script>
    window.addEventListener('load', () => {
      if (window.location.search) {
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    });
  </script>

</body>
</html>
