<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rimha</title>
  <link rel="icon" href="./images/icon2.png">
  <style>
    @font-face {
      font-family: 'Party LET';
      src: url('./fonts/PartyLET.woff2') format('woff2'),
           url('./fonts/PartyLET.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap; /* 폰트 로딩 중 기본 폰트로 먼저 텍스트를 보여주어 안 뜨는 현상 방지 */
    }

    :root {
      /* 배경 그라데이션은 그대로 유지하되, 원하시는 경우 수정 가능합니다 */
      --bg-start: #ff6fa8;
      --text:     #111111; /* 글자 색상을 검정색으로 변경 */
      --glow-a:   #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      background: radial-gradient(circle at 50% 40%, var(--bg-start), var(--bg-end));
      overflow: hidden;
    }

    .stage {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      /* 배경 이미지 경로 명확화 (만약 이미지가 없다면 배경색만 나옵니다) */
      background-image: url('./images/background.jpg');
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .stage::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255, 111, 168, 0.35);
    }

    .name-link {
      position: relative;
      z-index: 1;
      /* 브라우저에 폰트가 없을 때를 대비해 cursive(흘림체) 기본 폰트 추가 */
      font-family: 'Party LET', cursive, sans-serif;
      font-size: clamp(8rem, 40vw, 32rem);
      line-height: 1;
      color: var(--text);
      text-decoration: none;
      letter-spacing: 0.02em;
      user-select: none;
      cursor: pointer;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.25);
      transition: text-shadow 0.4s ease, transform 0.4s ease;
    }

    .name-link:hover,
    .name-link:focus-visible {
      transform: scale(1.03);
      text-shadow:
        0 0 20px var(--glow-a),
        0 0 45px var(--glow-b),
        0 0 90px var(--glow-b);
    }

    .name-link:focus-visible {
      outline: 2px dashed var(--text);
      outline-offset: 12px;
      border-radius: 4px;
    }

    @media (prefers-reduced-motion: reduce) {
      .name-link { transition: none; }
      .name-link:hover, .name-link:focus-visible { transform: none; }
    }
  </style>
</head>
<body>

  <main class="stage">
    <a class="name-link" href="https://instagram.com/rimhahan">rimha</a>
  </main>

  <script>
    if (window.location.search) {
      window.history.replaceState({}, document.title, window.location.pathname);
    }
  </script>

</body>
</html>
