<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rimha</title>
  <link rel="icon" type="image/png" href="/images/icon.png?v=8">
  <link rel="shortcut icon" type="image/png" href="/images/icon.png?v=8">
  <link rel="apple-touch-icon" href="/images/icon.png?v=8">
  <style>
    @font-face {
      font-family: 'Party LET';
      src: url('./fonts/PartyLET.woff2') format('woff2'),
           url('./fonts/PartyLET.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: block;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      background: #ffffff;
      overflow: hidden;
    }

    .stage {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      /* 배경 이미지만 깔끔하게 유지 */
      background-image: url('images/ggg.jpg');
      background-size: cover;
      background-position: center;
      position: relative;
    }

    /* 오버레이 코드는 완전히 삭제함! */

    .name-link {
      position: relative;
      z-index: 1;
      font-family: 'Party LET', cursive, sans-serif;
      font-size: clamp(8rem, 40vw, 32rem);
      line-height: 1;
      color: #111111; /* 평소 검은색 글자 */
      text-decoration: none;
      letter-spacing: 0.02em;
      user-select: none;
      cursor: pointer;
      /* 오직 글자 색상만 부드럽게 변하도록 설정 */
      transition: color 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 마우스를 올렸을 때 글자 색상만 흰색으로 변경 */
    .name-link:hover,
    .name-link:focus-visible {
      color: #ffffff;
    }

    .name-link:focus-visible {
      outline: 2px dashed #111111;
      outline-offset: 12px;
    }

    @media (prefers-reduced-motion: reduce) {
      .name-link { transition: none; }
    }
  </style>
</head>
<body>

  <main class="stage">
    <a class="name-link" href="https://instagram.com/rimhahan">rimha</a>
  </main>

  <script>
    window.addEventListener('load', () => {
      if (window.location.search) {
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    });
  </script>

</body>
</html>
